<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rando3D Lite</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        #map {
            width: 100%;
            height: 600px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: white;
            display: block;
        }
        #map.hidden {
            display: none !important;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #3d-view {
            width: 100%;
            height: 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f0f0f0;
            display: block;
            margin-bottom: 20px;
            overflow: hidden;
            transition: height 0.3s ease;
        }
        #3d-view.visible {
            height: 600px !important;
        }
        #info {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <h1>Rando3D Lite</h1>
    <p style="text-align: center; color: #7f8c8d;">Draw a route, visualize it in 3D and export it for printing!</p>
    
    <div class="container">
        <div id="map"></div>
        
        <div class="controls">
            <button id="draw-btn">Draw a route</button>
            <button id="clear-btn">Clear</button>
            <button id="3d-btn" disabled>View in 3D</button>
            <button id="export-btn" disabled>Export as STL</button>
            <button id="back-btn" style="display: none;">Back to map</button>
        </div>
        
        <div id="3d-view"></div>
        <div id="info"></div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/exporters/STLExporter.js"></script>
    
    <script>
        // ========== LEAFLET MAP ==========
        const map = L.map('map').setView([47.583, 12.166], 13); // Paris by default
        L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap France | &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Store the route
        let drawnRoute = null;
        let elevations = [];
        let isDrawing = false;

        // Group for drawn elements
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // Draw control (don't add it right away)
        const drawControl = new L.Control.Draw({
            edit: { featureGroup: drawnItems },
            draw: {
                polyline: true,
                polygon: false,
                rectangle: false,
                circle: false,
                marker: false,
                circlemarker: false
            }
        });

        // Button to enable/disable drawing
        document.getElementById('draw-btn').addEventListener('click', function() {
            if (!isDrawing) {
                drawControl.addTo(map);
                isDrawing = true;
                this.textContent = "Stop drawing";
                document.getElementById('info').textContent = "Draw your route on the map.";
            } else {
                map.removeControl(drawControl);
                isDrawing = false;
                this.textContent = "Draw a route";
            }
        });

        // Listen for route creation
        map.on(L.Draw.Event.CREATED, async function (e) {
            const layer = e.layer;
            drawnItems.addLayer(layer);
            drawnRoute = layer;

            // Verify the layer has points
            if (!layer.getLatLngs || !layer.getLatLngs().length) {
                document.getElementById('info').textContent = "Error: Invalid route.";
                return;
            }

            // Get the points (getLatLngs() returns an array of points for a polyline)
            const latLngs = layer.getLatLngs();
            if (!Array.isArray(latLngs) || latLngs.length < 2) {
                document.getElementById('info').textContent = `Error: Route too short (${latLngs.length} point(s)).`;
                return;
            }

            // Convert to [lat, lng] for Open-Elevation (not [lng, lat]!)
            const coords = latLngs.map(p => [p.lat, p.lng]);
            const locations = coords.map(c => c.join(',')).join('|');

            document.getElementById('info').textContent = "Fetching elevation data...";

            try {
                const response = await fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${locations}`);
                const data = await response.json();
                elevations = data.results.map(r => r.elevation);

                const maxElevation = Math.max(...elevations);
                const minElevation = Math.min(...elevations);
                document.getElementById('info').textContent =
                    `Route drawn: ${coords.length} points | Elevation: ${minElevation}m to ${maxElevation}m`;

                // Enable buttons
                document.getElementById('3d-btn').disabled = false;
                document.getElementById('export-btn').disabled = false;
            } catch (error) {
                document.getElementById('info').textContent = "Error fetching elevation data.";
                console.error(error);
            }
        });

        // Clear button
        document.getElementById('clear-btn').addEventListener('click', function() {
            drawnItems.clearLayers();
            drawnRoute = null;
            elevations = [];
            document.getElementById('3d-btn').disabled = true;
            document.getElementById('export-btn').disabled = true;
            document.getElementById('info').textContent = "";
            if (isDrawing) {
                map.removeControl(drawControl);
                isDrawing = false;
                document.getElementById('draw-btn').textContent = "Draw a route";
            }
        });

        // ========== 3D VISUALIZATION ==========
        let scene, camera, renderer;

        document.getElementById('3d-btn').addEventListener('click', function() {
            if (!drawnRoute || elevations.length === 0) {
                document.getElementById('info').textContent = "Error: No valid route to display.";
                return;
            }
            
            // Toggle visibility
            const mapElement = document.getElementById('map');
            const view3dElement = document.getElementById('3d-view');
            
            mapElement.classList.add('hidden');
            view3dElement.classList.add('visible');
            
            // Force reflow to trigger CSS transition
            void view3dElement.offsetHeight;
            
            document.getElementById('draw-btn').style.display = 'none';
            document.getElementById('clear-btn').style.display = 'none';
            document.getElementById('3d-btn').style.display = 'none';
            document.getElementById('export-btn').style.display = 'none';
            document.getElementById('back-btn').style.display = 'inline-block';
            
            document.getElementById('info').textContent = "Loading 3D view...";
            
            // Wait for CSS transition to complete using transitionend event
            const onTransitionEnd = () => {
                view3dElement.removeEventListener('transitionend', onTransitionEnd);
                
                const width = view3dElement.clientWidth;
                const height = view3dElement.clientHeight;
                console.log('3D View dimensions after reflow:', width, 'x', height);
                
                if (width > 0 && height > 0) {
                    initThreeJS();
                    create3DScene();
                } else {
                    console.error('Container dimensions invalid:', {width, height});
                    document.getElementById('info').textContent = "Error: Could not initialize 3D view";
                }
            };
            
            view3dElement.addEventListener('transitionend', onTransitionEnd);
        });

        function initThreeJS() {
            const container = document.getElementById('3d-view');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            console.log('Initializing Three.js with dimensions:', width, 'x', height);
            
            if (width === 0 || height === 0) {
                console.error('Container has invalid dimensions!', {width, height});
                document.getElementById('info').textContent = "Error: 3D view container has no size";
                return false;
            }
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);
            
            camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 10000);
            camera.position.set(0, 20, 30);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            container.innerHTML = '';
            container.appendChild(renderer.domElement);
            
            console.log('WebGL Renderer created successfully');
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);
            
            // Orbital controls to navigate the scene
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = false;
            
            // Resize handler
            const resizeHandler = () => {
                const newWidth = container.clientWidth;
                const newHeight = container.clientHeight;
                if (newWidth > 0 && newHeight > 0) {
                    camera.aspect = newWidth / newHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(newWidth, newHeight);
                }
            };
            
            window.addEventListener('resize', resizeHandler);
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
            
            console.log('Three.js initialized successfully');
            return true;
        }

        function create3DScene() {
            try {
                if (!scene || !camera) {
                    console.error('Scene or camera not initialized');
                    return;
                }
                
                // Get the route coordinates
                const latLngs = drawnRoute.getLatLngs();
                console.log('Route points:', latLngs.length);
                console.log('Elevations:', elevations.length);
                
                if (latLngs.length === 0) {
                    console.error('No route points found');
                    return;
                }
                
                // Center coordinates around (0,0) for Three.js
                const centerLng = latLngs.reduce((sum, p) => sum + p.lng, 0) / latLngs.length;
                const centerLat = latLngs.reduce((sum, p) => sum + p.lat, 0) / latLngs.length;
                
                // Create an array of points for the route
                const points = latLngs.map((p, index) => ({
                    x: (p.lng - centerLng) * 1000,
                    z: (p.lat - centerLat) * 1000,
                    y: elevations[index] / 100
                }));
                
                console.log('Points created:', points.length);
                console.log('Sample point:', points[0]);
                
                // Create a line for the route
                const lineGeometry = new THREE.BufferGeometry();
                const lineVertices = points.map(p => new THREE.Vector3(p.x, p.y + 0.5, p.z));
                lineGeometry.setFromPoints(lineVertices);
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 3 });
                const line = new THREE.Line(lineGeometry, lineMaterial);
                scene.add(line);
                console.log('Route line added');
                
                // Add points as spheres for elevation markers
                points.forEach((p, index) => {
                    const sphereGeometry = new THREE.SphereGeometry(0.5, 16, 16);
                    const sphereMaterial = new THREE.MeshPhongMaterial({ color: 0x0000ff });
                    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
                    sphere.position.set(p.x, p.y, p.z);
                    scene.add(sphere);
                });
                console.log('Elevation spheres added');
                
                // Calculate bounds for camera positioning
                const allX = points.map(p => p.x);
                const allY = points.map(p => p.y);
                const allZ = points.map(p => p.z);
                
                const minX = Math.min(...allX);
                const maxX = Math.max(...allX);
                const minY = Math.min(...allY);
                const maxY = Math.max(...allY);
                const minZ = Math.min(...allZ);
                const maxZ = Math.max(...allZ);
                
                const centerX = (minX + maxX) / 2;
                const centerY = (minY + maxY) / 2;
                const centerZ = (minZ + maxZ) / 2;
                
                const sizeX = Math.abs(maxX - minX) || 1;
                const sizeY = Math.abs(maxY - minY) || 1;
                const sizeZ = Math.abs(maxZ - minZ) || 1;
                const maxSize = Math.max(sizeX, sizeY, sizeZ);
                
                // Adjust camera to see the entire route
                const distance = maxSize * 1.5;
                camera.position.set(centerX + distance, centerY + distance, centerZ + distance);
                camera.lookAt(centerX, centerY, centerZ);
                
                console.log('Scene created successfully');
                console.log('Camera position:', camera.position);
                document.getElementById('info').textContent = "3D view loaded! Use mouse to rotate.";
            } catch (error) {
                console.error('Error creating 3D scene:', error);
                document.getElementById('info').textContent = "Error creating 3D view: " + error.message;
            }
        }

        // ========== STL EXPORT ==========
        document.getElementById('export-btn').addEventListener('click', function() {
            if (!scene) {
                document.getElementById('info').textContent = "Error: No 3D scene to export.";
                return;
            }
            
            document.getElementById('info').textContent = "Generating STL file...";
            
            // Create an STL exporter
            const exporter = new THREE.STLExporter();
            
            // Export the scene
            const stlString = exporter.parse(scene);
            
            // Create a blob and download link
            const blob = new Blob([stlString], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'rando3d-export.stl';
            a.click();
            URL.revokeObjectURL(url);
            
            document.getElementById('info').textContent = "STL file downloaded!";
        });

        // Button to return to map
        document.getElementById('back-btn').addEventListener('click', function() {
            const mapElement = document.getElementById('map');
            const view3dElement = document.getElementById('3d-view');
            
            mapElement.classList.remove('hidden');
            view3dElement.classList.remove('visible');
            
            document.getElementById('draw-btn').style.display = 'inline-block';
            document.getElementById('clear-btn').style.display = 'inline-block';
            document.getElementById('3d-btn').style.display = 'inline-block';
            document.getElementById('export-btn').style.display = 'inline-block';
            document.getElementById('back-btn').style.display = 'none';
            
            // Clean up the Three.js scene
            if (renderer) {
                renderer.dispose();
                document.getElementById('3d-view').innerHTML = '';
            }
        });
    </script>
</body>
</html>
