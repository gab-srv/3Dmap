<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rando3D Lite</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        #map {
            height: 500px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: white;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #3d-view {
            height: 500px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: white;
            display: none;
        }
        #info {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <h1>Rando3D Lite</h1>
    <p style="text-align: center; color: #7f8c8d;">Tracez un itinéraire, visualisez-le en 3D et exportez-le pour impression !</p>
    
    <div id="map"></div>
    
    <div class="controls">
        <button id="draw-btn">Dessiner un itinéraire</button>
        <button id="clear-btn">Effacer</button>
        <button id="3d-btn" disabled>Voir en 3D</button>
        <button id="export-btn" disabled>Exporter en STL</button>
        <button id="back-btn" style="display: none;">Retour à la carte</button>
    </div>
    
    <div id="3d-view"></div>
    <div id="info"></div>

    <!-- Bibliothèques JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/exporters/STLExporter.js"></script>
    
    <script>
        // ========== CARTE LEAFLET ==========
        const map = L.map('map').setView([47.583, 12.166], 13); // Paris par défaut
        L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap France | &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Stockage de l'itinéraire
        let drawnRoute = null;
        let elevations = [];
        let isDrawing = false;

        // Groupe pour les éléments dessinés
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // Contrôle de dessin (ne pas l'ajouter tout de suite)
        const drawControl = new L.Control.Draw({
            edit: { featureGroup: drawnItems },
            draw: {
                polyline: true,
                polygon: false,
                rectangle: false,
                circle: false,
                marker: false,
                circlemarker: false
            }
        });

        // Bouton pour activer/désactiver le dessin
        document.getElementById('draw-btn').addEventListener('click', function() {
            if (!isDrawing) {
                drawControl.addTo(map);
                isDrawing = true;
                this.textContent = "Arrêter de dessiner";
                document.getElementById('info').textContent = "Dessinez votre itinéraire sur la carte.";
            } else {
                map.removeControl(drawControl);
                isDrawing = false;
                this.textContent = "Dessiner un itinéraire";
            }
        });

        // Écouter la création d'un itinéraire
        map.on(L.Draw.Event.CREATED, async function (e) {
            const layer = e.layer;
            drawnItems.addLayer(layer);
            drawnRoute = layer;

            // Vérifier que la couche a bien des points
            if (!layer.getLatLngs || !layer.getLatLngs().length) {
                document.getElementById('info').textContent = "Erreur : Itinéraire invalide.";
                return;
            }

            // Récupérer les points (getLatLngs() retourne un tableau de points pour une polyligne)
            const latLngs = layer.getLatLngs();
            if (!Array.isArray(latLngs) || latLngs.length < 2) {
                document.getElementById('info').textContent = `Erreur : Itinéraire trop court (${latLngs.length} point(s)).`;
                return;
            }

            // Convertir en [lat, lng] pour Open-Elevation (et non [lng, lat] !)
            const coords = latLngs.map(p => [p.lat, p.lng]);
            const locations = coords.map(c => c.join(',')).join('|');

            document.getElementById('info').textContent = "Récupération des altitudes...";

            try {
                const response = await fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${locations}`);
                const data = await response.json();
                elevations = data.results.map(r => r.elevation);

                const maxElevation = Math.max(...elevations);
                const minElevation = Math.min(...elevations);
                document.getElementById('info').textContent =
                    `Itinéraire tracé : ${coords.length} points | Altitude : ${minElevation}m à ${maxElevation}m`;

                // Activer les boutons
                document.getElementById('3d-btn').disabled = false;
                document.getElementById('export-btn').disabled = false;
            } catch (error) {
                document.getElementById('info').textContent = "Erreur lors de la récupération des altitudes.";
                console.error(error);
            }
        });

        // Bouton pour effacer
        document.getElementById('clear-btn').addEventListener('click', function() {
            drawnItems.clearLayers();
            drawnRoute = null;
            elevations = [];
            document.getElementById('3d-btn').disabled = true;
            document.getElementById('export-btn').disabled = true;
            document.getElementById('info').textContent = "";
            if (isDrawing) {
                map.removeControl(drawControl);
                isDrawing = false;
                document.getElementById('draw-btn').textContent = "Dessiner un itinéraire";
            }
        });

        // ========== VISUALISATION 3D ==========
        let scene, camera, renderer;

        document.getElementById('3d-btn').addEventListener('click', function() {
            if (!drawnRoute || elevations.length === 0) {
                document.getElementById('info').textContent = "Erreur : Aucun itinéraire valide à afficher.";
                return;
            }
            
            // Masquer la carte
            document.getElementById('map').style.display = 'none';
            document.getElementById('3d-view').style.display = 'block';
            document.getElementById('draw-btn').style.display = 'none';
            document.getElementById('clear-btn').style.display = 'none';
            document.getElementById('3d-btn').style.display = 'none';
            document.getElementById('export-btn').style.display = 'none';
            document.getElementById('back-btn').style.display = 'inline-block';
            
            // Initialiser Three.js
            initThreeJS();
            create3DScene();
        });

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);
            
            const width = document.getElementById('3d-view').clientWidth;
            const height = document.getElementById('3d-view').clientHeight;
            
            camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.set(0, 5, 10);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            document.getElementById('3d-view').innerHTML = '';
            document.getElementById('3d-view').appendChild(renderer.domElement);
            
            // Lumière
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);
            
            // Contrôles orbitaux pour naviguer dans la scène
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Redimensionner si la fenêtre change
            window.addEventListener('resize', function() {
                const newWidth = document.getElementById('3d-view').clientWidth;
                const newHeight = document.getElementById('3d-view').clientHeight;
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
            });
            
            // Animation
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }

        function create3DScene() {
            // Récupérer les coordonnées de l'itinéraire
            const latLngs = drawnRoute.getLatLngs();
            
            // Centrer les coordonnées autour de (0,0) pour Three.js
            const centerLng = latLngs.reduce((sum, p) => sum + p.lng, 0) / latLngs.length;
            const centerLat = latLngs.reduce((sum, p) => sum + p.lat, 0) / latLngs.length;
            
            // Créer un tableau de points pour le terrain
            const points = latLngs.map((p, index) => ({
                x: (p.lng - centerLng) * 100, // Échelle arbitraire pour la visualisation
                z: (p.lat - centerLat) * 100,
                y: elevations[index] / 50 // Diviser par 50 pour réduire l'échelle verticale
            }));
            
            // Créer une ligne pour l'itinéraire
            const lineGeometry = new THREE.BufferGeometry();
            const lineVertices = points.map(p => new THREE.Vector3(p.x, p.y + 0.5, p.z));
            lineGeometry.setFromPoints(lineVertices);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 3 });
            const line = new THREE.Line(lineGeometry, lineMaterial);
            scene.add(line);
            
            // Créer un terrain basique (plan avec hauteur variable)
            const terrainGeometry = new THREE.PlaneGeometry(20, 20, 10, 10);
            const terrainMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x00aa00, 
                side: THREE.DoubleSide 
            });
            const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
            terrain.rotation.x = -Math.PI / 2; // Tourner le plan pour qu'il soit horizontal
            terrain.position.y = -1; // Placer sous l'itinéraire
            scene.add(terrain);
            
            // Ajouter des points pour les altitudes
            points.forEach(p => {
                const sphereGeometry = new THREE.SphereGeometry(0.3, 16, 16);
                const sphereMaterial = new THREE.MeshPhongMaterial({ color: 0x0000ff });
                const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
                sphere.position.set(p.x, p.y, p.z);
                scene.add(sphere);
            });
            
            // Ajuster la caméra
            camera.lookAt(0, 0, 0);
        }

        // ========== EXPORT STL ==========
        document.getElementById('export-btn').addEventListener('click', function() {
            if (!scene) {
                document.getElementById('info').textContent = "Erreur : Aucune scène 3D à exporter.";
                return;
            }
            
            document.getElementById('info').textContent = "Génération du fichier STL...";
            
            // Créer un exporteur STL
            const exporter = new THREE.STLExporter();
            
            // Exporter la scène
            const stlString = exporter.parse(scene);
            
            // Créer un blob et un lien de téléchargement
            const blob = new Blob([stlString], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'rando3d-export.stl';
            a.click();
            URL.revokeObjectURL(url);
            
            document.getElementById('info').textContent = "Fichier STL téléchargé !";
        });

        // Bouton pour revenir à la carte
        document.getElementById('back-btn').addEventListener('click', function() {
            document.getElementById('map').style.display = 'block';
            document.getElementById('3d-view').style.display = 'none';
            document.getElementById('draw-btn').style.display = 'inline-block';
            document.getElementById('clear-btn').style.display = 'inline-block';
            document.getElementById('3d-btn').style.display = 'inline-block';
            document.getElementById('export-btn').style.display = 'inline-block';
            document.getElementById('back-btn').style.display = 'none';
            
            // Nettoyer la scène Three.js
            if (renderer) {
                renderer.dispose();
                document.getElementById('3d-view').innerHTML = '';
            }
        });
    </script>
</body>
</html>
